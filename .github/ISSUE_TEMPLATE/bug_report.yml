name: Bug report
description: Report a problem with TURMO Linux
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
        Do **not** include tokens, passwords or private config files.
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Ubuntu 24.04.5 LTS"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display model
      placeholder: "Turing Smart Screen 3.5 (rev. A) / UsbPCMonitor 5\""
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: How is TURMO running?
      options:
        - Per-user systemd service
        - System-wide systemd service
        - Manually from a terminal
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "journalctl --user -u turmo-display -n 100 --no-pager"
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest release.
          required: true
        - label: I removed tokens, passwords and private data from logs.
          required: true
